function getFlashPool(){let p=WORDS.filter(w=>flash.mode==='all'||(flash.mode==='saved'&&db.favorites.includes(w.id))||(flash.mode==='due'&&db.reviews[w.id]&&db.reviews[w.id].due<=dateKey()));return p.map(w=>w.id);}

function flashcards(){if(!flash.ids.length)nextFlash(true);const w=WORDS.find(x=>x.id===flash.ids[flash.index]);const reviewed=totalReviewed();return `${head('Smart Flashcards','Lật thẻ để xem nghĩa, ví dụ và đánh giá mức độ nhớ. Lịch ôn được lưu ngay trên trình duyệt.',`<button class="btn ghost" data-go="vocabulary">Mở thư viện ↗</button>`)}<div class="grid cols-3 mb">${st('🧠',reviewed,'Từ đã ôn','lavender')}${st('⏰',dueWords(),'Từ đến hạn','gold')}${st('♥',db.favorites.length,'Từ yêu thích','mint')}</div><div class="filter-row">${[['all','Tất cả'],['saved','Từ đã lưu'],['due','Cần ôn hôm nay']].map(([v,t])=>`<button class="chip ${flash.mode===v?'selected':''}" data-flash-mode="${v}">${t}</button>`).join('')}</div><div class="flash-layout"><div>${w?`<div class="flash-card" data-flip role="button" tabindex="0" aria-label="Lật flashcard"><div class="flash-label">${flash.flipped?'MẶT SAU':'MẶT TRƯỚC'} • ${flash.index+1}/${flash.ids.length}</div><h2>${flash.flipped?esc(w.vi):esc(w.word)}</h2><p>${flash.flipped?`<strong>${esc(w.example)}</strong><br>${esc(w.translation)}<br><small>${esc(w.collocation)}</small>`:`/${esc(w.ipa)}/ · ${esc(w.pos)}`}</p><span class="flash-help">↻ Bấm vào thẻ để lật</span></div><div class="flash-toolbar"><button class="btn outline" data-say="${esc(w.word)}">♫ Nghe từ</button>${flash.flipped?`<button class="btn outline" data-review="again">Chưa nhớ</button><button class="btn ghost" data-review="hard">Khó</button><button class="btn" data-review="good">Đã nhớ</button><button class="btn secondary" data-review="easy">Rất dễ</button>`:`<button class="btn" data-flip>Hiện đáp án ↻</button>`}</div>`:`<div class="card empty"><span class="empty-icon">📭</span>Chưa có từ trong nhóm này.<p>Hãy lưu từ trong thư viện hoặc chuyển sang chế độ “Tất cả”.</p><button class="btn" data-go="vocabulary">Khám phá từ vựng</button></div>`}</div><aside class="card"><h3 class="inline-title">Cách ôn tập</h3><p class="page-sub">Flashcards sử dụng lịch ôn theo mức độ bạn đánh giá. Đây là thuật toán ôn tập cơ bản lấy cảm hứng từ spaced repetition.</p><div class="list"><div class="feedback-item"><strong>🔴 Chưa nhớ</strong><span>Ôn lại từ vào ngày mai.</span></div><div class="feedback-item"><strong>🟠 Khó</strong><span>Giảm khoảng cách giữa các lần ôn.</span></div><div class="feedback-item"><strong>🔵 Đã nhớ</strong><span>Tăng dần thời gian tới lần ôn tiếp theo.</span></div><div class="feedback-item"><strong>🟢 Rất dễ</strong><span>Lùi ngày ôn xa hơn.</span></div></div><div class="note mt">Khi đã nhớ một từ, hãy thử nói thành tiếng một câu của riêng bạn để áp dụng nó.</div></aside></div>`;}
function reviewWord(rating){const id=flash.ids[flash.index],old=db.reviews[id]||{repetitions:0,interval:0};let reps=old.repetitions||0,interval=old.interval||0;if(rating==='again'){reps=0;interval=1;}else if(rating==='hard'){reps=Math.max(1,reps);interval=Math.max(1,Math.round((interval||2)*1.2));}else if(rating==='good'){reps++;interval=reps===1?2:reps===2?5:Math.round(interval*2);}else{reps++;interval=reps===1?4:reps===2?9:Math.round(interval*2.7);}const d=new Date();d.setDate(d.getDate()+interval);db.reviews[id]={repetitions:reps,interval,due:dateKey(d),last:dateKey(),rating};markActivity('review');nextFlash();render();toast(`Đã lưu lịch ôn: sau ${interval} ngày`);}
function buildQuiz(){
  const pool=WORDS.filter(w=>quiz.level==='All'||w.level===quiz.level);
  quiz.ids=pool.map(w=>w.id).sort(()=>Math.random()-.5).slice(0,Math.min(10,pool.length));
  quiz.index=0;quiz.choice=null;quiz.finished=false;quiz.correct=0;quiz.answers=[];
}
function quizPage(){
  if(!quiz.ids.length)buildQuiz();
  const total=quiz.ids.length;
  if(quiz.finished){const percent=Math.round(quiz.correct/total*100);return `${head('Vocabulary Quiz','Bài kiểm tra từ vựng 10 câu • Đã lưu kết quả vào Tiến độ.')}
    <div class="card quiz-card quiz-finish"><div class="quiz-medal">${percent>=80?'🏆':percent>=50?'✨':'📘'}</div><h2>Hoàn thành bài kiểm tra!</h2><div class="quiz-score">${quiz.correct}/${total}</div><p>Đúng ${percent}% • ${esc(quiz.level==='All'?'Nhiều cấp độ':quiz.level)}</p><p class="page-sub">${percent>=80?'Bạn đang ghi nhớ khá tốt. Hãy thử cấp độ khó hơn.':'Hãy xem lại những câu còn nhầm rồi luyện thêm flashcards.'}</p><div class="filter-row quiz-controls"><button class="btn" data-quiz-restart>↻ Làm bài mới</button><button class="btn outline" data-go="flashcards">🧠 Ôn Flashcards</button><button class="btn ghost" data-go="progress">Xem tiến độ →</button></div><div class="quiz-review">${quiz.answers.map((a,i)=>{const w=WORDS.find(x=>x.id===a.id);return `<div class="quiz-review-row"><span>${a.correct?'✅':'❌'}</span><span><strong>${esc(w.word)}</strong> — ${esc(w.vi)}${a.correct?'':`<br><small>Bạn chọn: ${esc(a.picked)}</small>`}</span></div>`}).join('')}</div></div>`;}
  const w=WORDS.find(x=>x.id===quiz.ids[quiz.index]);
  // Stable distractor choice for each displayed question, not re-randomized when answering.
  if(!quiz.options||quiz.optionsWord!==w.id){const distractors=WORDS.filter(x=>x.id!==w.id&&x.vi!==w.vi&&(!quiz.level||quiz.level==='All'||x.level===quiz.level)).sort(()=>Math.random()-.5).slice(0,3);if(distractors.length<3)distractors.push(...WORDS.filter(x=>x.id!==w.id&&!distractors.some(d=>d.id===x.id)).slice(0,3-distractors.length));quiz.options=[w,...distractors].sort(()=>Math.random()-.5);quiz.optionsWord=w.id;}
  const answered=quiz.choice!==null;
  return `${head('Vocabulary Quiz','Luyện từ vựng A1–C2 với 10 câu hỏi lựa chọn nghĩa tiếng Việt.','<button class="btn ghost" data-go="flashcards">Ôn Flashcards ↗</button>')}
  <div class="card quiz-card"><div class="filter-row quiz-top"><label for="quizLevel">Trình độ</label><select id="quizLevel" class="control" ${quiz.index>0?'disabled':''}><option value="All" ${quiz.level==='All'?'selected':''}>Tất cả</option>${['A1','A2','B1','B2','C1','C2'].map(l=>`<option ${quiz.level===l?'selected':''}>${l}</option>`).join('')}</select><span class="pill purple">Câu ${quiz.index+1}/${total}</span></div><div class="progress-track quiz-track"><div style="width:${Math.round(100*quiz.index/total)}%"></div></div><p class="eyebrow">CHỌN NGHĨA ĐÚNG</p><h2 class="quiz-word">${esc(w.word)}</h2><p class="ipa">/${esc(w.ipa)}/ · ${esc(w.pos)} <button class="circle-audio" data-say="${esc(w.word)}" aria-label="Nghe phát âm">♫</button></p><div class="quiz-options">${quiz.options.map(o=>`<button data-quiz-choice="${o.id}" class="quiz-option ${answered?(o.id===w.id?'right':o.id===quiz.choice?'wrong':''):''}" ${answered?'disabled':''}>${esc(o.vi)}</button>`).join('')}</div>${answered?`<div class="note mt ${quiz.choice===w.id?'':'warning'}"><strong>${quiz.choice===w.id?'✓ Chính xác!':'Đáp án đúng: '+esc(w.vi)}</strong><p>${esc(w.example)}</p><em>${esc(w.translation)}</em></div><button class="btn quiz-next" data-quiz-next>${quiz.index===total-1?'Xem kết quả →':'Câu tiếp theo →'}</button>`:'<p class="small muted">Chọn một đáp án để xem ví dụ và giải thích.</p>'}</div>`;
}
function quizChoose(id){if(quiz.choice!==null)return;const w=WORDS.find(x=>x.id===quiz.ids[quiz.index]);if(!quiz.options?.some(o=>o.id===id))return;quiz.choice=id;const picked=WORDS.find(x=>x.id===id);const correct=id===w.id;if(correct)quiz.correct++;quiz.answers.push({id:w.id,correct,picked:picked.vi});render();}
function quizNext(){if(quiz.choice===null)return;if(quiz.index>=quiz.ids.length-1){quiz.finished=true;db.quizAttempts.unshift({date:new Date().toISOString(),level:quiz.level,correct:quiz.correct,total:quiz.ids.length});db.quizAttempts=db.quizAttempts.slice(0,100);markActivity('review');}else{quiz.index++;quiz.choice=null;quiz.options=null;quiz.optionsWord=null;}render();}
function feedbackFor(text){const s=String(text).trim(),words=s.split(/\s+/).filter(Boolean),n=words.length;const suggestions=[];if(n<8)suggestions.push('Thử trả lời thành 2–3 câu, thay vì một cụm ngắn.');else if(n<18)suggestions.push('Thêm một lý do hoặc ví dụ để phát triển câu trả lời.');else suggestions.push('Bạn đã đưa ra câu trả lời tương đối đầy đủ về độ dài.');if(!/\b(because|for example|such as|since|however|although|so)\b/i.test(s))suggestions.push('Có thể thêm “because” hoặc “for example” để liên kết ý.');if(!/[.!?]$/.test(s))suggestions.push('Chú ý hoàn chỉnh câu và dấu câu khi viết transcript.');const variants={"i very like":"I really like","i am agree":"I agree","more better":"better","discuss about":"discuss","in my opinion i think":"In my opinion,","i have 20 years":"I am 20 years old"};let fixed=s;Object.entries(variants).forEach(([wrong,right])=>{fixed=fixed.replace(new RegExp(wrong,'gi'),right);});return {words:n,suggestions,possibleCorrection:fixed!==s?fixed:null};}
function startPractice(){speak={...speak,active:true,messages:[],lastFeedback:null,loading:false,startedAt:Date.now()};const q=SPEAK_TOPICS[speak.topic].questions[0];speak.messages.push({role:'assistant',text:`Hi! Let's talk about ${speak.topic.toLowerCase()}. ${q}`});render();if(db.settings.autoSpeak)readAloud(speak.messages[0].text);}
function nextDemo(text){const topic=SPEAK_TOPICS[speak.topic];const responseIndex=speak.messages.filter(x=>x.role==='user').length;const q=topic.questions[responseIndex%topic.questions.length];const lead=['Thanks for sharing!','That is interesting!','I see what you mean.','Good point!','Thanks for explaining your idea.'][responseIndex%5];return `${lead} ${q}`;}
function speechPanel(){return `${head('AI Speaking Partner','Luyện phản xạ giao tiếp và thực hành hội thoại theo chủ đề. Chọn micro để nhập giọng nói nếu trình duyệt hỗ trợ.',`<span class="pill ${apiConnected?'green':'orange'}">${apiConnected?'● Có thể bật AI thật':'● DEMO SCRIPTED · Chưa kết nối API'}</span>`)}<div class="grid cols-3 mb">${st('🎤',db.sessions.length,'Buổi đã lưu','mint')}${st('⏱',spokenMinutes(),'Phút luyện đã ghi nhận','lavender')}${st('🧭',speak.level,'Trình độ đang luyện')}</div><div class="practice-layout"><section class="card"><div class="section-header"><div><h2>💬 Conversation Studio</h2><p>${speak.active?'Trả lời bằng lời nói hoặc nhập văn bản':'Thiết lập chủ đề, sau đó bắt đầu'}</p></div>${pill(speak.mode==='ai'?'OpenAI · live':'Demo có kịch bản',speak.mode==='ai'?'green':'orange')}</div><div class="filter-row"><select id="speakTopic" class="control" aria-label="Chủ đề giao tiếp" ${speak.active?'disabled':''}>${Object.keys(SPEAK_TOPICS).map(x=>`<option ${speak.topic===x?'selected':''}>${x}</option>`).join('')}</select><select id="speakLevel" class="control" aria-label="Trình độ" ${speak.active?'disabled':''}>${['A1','A2','B1','B2','C1','C2'].map(x=>`<option ${speak.level===x?'selected':''}>${x}</option>`).join('')}</select>${apiConnected?`<select id="speakMode" class="control" ${speak.active?'disabled':''}><option value="demo" ${speak.mode==='demo'?'selected':''}>Demo</option><option value="ai" ${speak.mode==='ai'?'selected':''}>AI thật</option></select>`:''}</div><div class="chat-panel"><div class="chat-log" id="chatLog">${speak.messages.length?speak.messages.map(m=>`<div class="bubble-row ${m.role==='user'?'user':''}"><span class="chat-avatar">${m.role==='user'?'🙂':'🤖'}</span><div class="bubble">${esc(m.text)}</div>${m.role==='assistant'?`<button class="circle-audio" data-say="${esc(m.text)}" title="Nghe câu hỏi">♫</button>`:''}</div>`).join(''):`<div class="empty" style="margin:auto"><span class="empty-icon">🎧</span><h3>Sẵn sàng luyện Speaking?</h3><p>Chọn một chủ đề, sau đó bấm “Bắt đầu hội thoại”.</p></div>`}${speak.loading?'<div class="badge-dash">AI đang phản hồi...</div>':''}</div><div class="chat-bottom">${speak.active?`<div class="input-line"><input class="control" id="speakAnswer" placeholder="Nói qua micro hoặc nhập câu trả lời bằng tiếng Anh…" aria-label="Câu trả lời của bạn" ${speak.loading?'disabled':''}/><button class="btn icon-btn ghost" data-record="speak" title="Ghi âm / nhận giọng nói">🎤</button><button class="btn" data-send-answer ${speak.loading?'disabled':''}>Gửi ➤</button></div><div class="filter-row" style="margin:12px 0 0;justify-content:space-between"><div id="micStatus" class="small muted">Trình duyệt hỗ trợ giọng nói sẽ tự điền transcript.</div><button class="btn tiny outline" data-end-practice>■ Kết thúc & lưu</button></div>`:`<button class="btn" data-start-practice>▶ Bắt đầu hội thoại</button>`}</div></div></section><aside class="stack"><div class="card"><h3 class="inline-title">✨ Gợi ý cải thiện</h3>${speak.lastFeedback?`<div class="list"><div class="feedback-item"><strong>${speak.lastFeedback.words} từ trong câu trả lời</strong><span>Đây là số từ của transcript, không phải điểm Speaking.</span></div>${speak.lastFeedback.suggestions.map(s=>`<div class="feedback-item"><span>↗ ${esc(s)}</span></div>`).join('')}${speak.lastFeedback.possibleCorrection?`<div class="feedback-item"><strong>Gợi ý chỉnh lỗi thường gặp</strong><span>${esc(speak.lastFeedback.possibleCorrection)}</span></div>`:''}</div>`:`<p class="page-sub">Sau mỗi lượt nói, bạn sẽ nhận gợi ý phát triển ý và cách liên kết câu. Bản demo không giả lập điểm phát âm.</p>`}</div><div class="card"><h3 class="inline-title">💡 Mẹo trả lời tự nhiên</h3><p class="small" style="line-height:1.75;color:#71829f"><strong>Answer → Reason → Example.</strong><br>Trả lời trực tiếp, giải thích lý do, thêm ví dụ cụ thể.</p><div class="note">Ví dụ: “I enjoy reading because it helps me relax. For example, I often read before going to bed.”</div></div><div class="card"><h3 class="inline-title">🔊 Microphone</h3><p class="small muted" style="line-height:1.75">Nhận diện giọng nói phụ thuộc trình duyệt. Nếu không hỗ trợ, bạn có thể ghi âm để nghe lại và nhập văn bản thay thế.</p><button class="btn ghost tiny" data-say="Practice makes progress. Keep speaking every day.">♫ Thử giọng đọc</button></div></aside></div>`;}
async function submitSpeak(){const input=$('#speakAnswer');if(!input||speak.loading)return;const text=input.value.trim();if(!text){toast('Hãy nhập hoặc nói câu trả lời trước.');return;}speak.messages.push({role:'user',text});speak.lastFeedback=feedbackFor(text);input.value='';speak.loading=true;render();const container=$('#chatLog');if(container)container.scrollTop=container.scrollHeight;

v><div class="question-tools"><button class="btn ghost tiny" data-timer="prep">⏱ Chuẩn bị</button><button class="btn ghost tiny" data-timer="speak">🎤 Bắt đầu nói</button><button class="btn outline tiny" data-timer="stop">Dừng</button></div></div><label class="small muted" for="examAnswer">Câu trả lời / transcript</label><textarea id="examAnswer" class="control area" style="min-height:134px;margin-top:8px" placeholder="Bạn có thể trả lời bằng microphone hoặc gõ câu trả lời ở đây…">${esc(exam.answer)}</textarea><div class="filter-row"><button class="btn ghost" data-record="exam">🎤 Micro</button><button class="btn" data-check-exam>✓ Lưu bài luyện</button><button class="btn outline" data-show-sample>📘 Bài mẫu</button>${apiConnected?'<button class="btn secondary" data-ai-evaluate>✨ AI nhận xét</button>':''}<button class="btn outline" data-next-exam>Tiếp theo →</button></div><div id="micStatus" class="small muted">Bạn có thể nhập transcript nếu trình duyệt không hỗ trợ nhận diện giọng nói.</div>${exam.feedback?`<div class="note mt">${exam.feedback}</div>`:''}<div class="note warning mt">Đây là bài luyện và phản hồi dựa trên transcript. Không có điểm IELTS/TOEIC chính thức hoặc đánh giá phát âm từ audio.</div></section></div>`;}

function startTimer(mode){stopTimer();const isI=exam.kind==='ielts',q=currentQuestion();secondsLeft=mode==='prep'?(isI&&exam.part==='Part 2'?60:isI?30:q.prep||30):(isI&&exam.part==='Part 2'?120:isI?60:q.duration||60);const label=$('#timerCaption');if(label)label.textContent=mode==='prep'?'Đang đếm thời gian chuẩn bị':'Đang đếm thời gian trả lời';const display=$('#examTimer');if(display)display.textContent=showTimer(secondsLeft);timerInterval=setInterval(()=>{secondsLeft=Math.max(0,secondsLeft-1);const node=$('#examTimer');if(node)node.textContent=showTimer(secondsLeft);if(secondsLeft===0){stopTimer();toast('Hết thời gian! Bạn có thể lưu câu trả lời.');}},1000);}
function saveExam(){const text=$('#examAnswer')?.value.trim()||'';if(!text){toast('Hãy trả lời trước khi lưu bài luyện.');return;}const q=currentQuestion();let f=feedbackFor(text);db.examAttempts.unshift({kind:exam.kind,part:exam.part,question:q.q||q.text,answer:text,created:new Date().toISOString(),words:f.words});db.examAttempts=db.examAttempts.slice(0,200);markActivity('exam');exam.feedback=`<strong>Đã lưu bài luyện gồm ${f.words} từ.</strong><br>Gợi ý: ${f.suggestions.map(esc).join(' ')}<br><em>Phân tích dựa trên văn bản, chưa đánh giá phát âm hoặc band/điểm thi.</em>`;exam.answer=text;stopTimer();render();toast('Đã lưu bài Speaking vào lịch sử tiến độ.');}
async function evaluateExamWithAI(){
  const answer=$('#examAnswer')?.value.trim()||'';
  if(!answer){toast('Nhập câu trả lời trước khi nhận xét.');return;}
  if(!apiConnected){toast('Cần kết nối OpenAI API trên máy chủ.');return;}
  const q=currentQuestion();const request={exam:exam.kind,level:db.level,question:q.q||q.text,answer};
  exam.answer=answer;exam.feedback='<em>AI đang đọc câu trả lời…</em>';render();
  try{const response=await fetch('/api/evaluate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(request)});const result=await response.json();if(!response.ok)throw Error(result.error||'Không nhận được nhận xét.');exam.feedback='<strong>✨ AI nhận xét nội dung transcript (không phải điểm thi):</strong><br>'+esc(result.feedback).replace(/\n/g,'<br>');}
  catch(e){exam.feedback='<strong>Không thể nhận xét:</strong> '+esc(e.message);}
  render();
}

try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});recordChunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)recordChunks.push(e.data);};recorder.onstop=()=>{if(recordBlobUrl)URL.revokeObjectURL(recordBlobUrl);recordBlobUrl=URL.createObjectURL(new Blob(recordChunks,{type:recorder.mimeType||'audio/webm'}));stream.getTracks().forEach(t=>t.stop());const playback=$('#recordPlayback');if(playback)playback.innerHTML=`<div class="note">Bản ghi âm để bạn nghe lại (chưa tạo transcript):<br><audio controls style="max-width:100%;margin-top:9px" src="${recordBlobUrl}"></audio></div>`;else openModal(`<div class="modal-top"><h2>🎧 Bản ghi âm của bạn</h2><button class="x-btn" data-close-modal>✕</button></div><p>Trình duyệt không hỗ trợ Speech-to-Text. Bạn có thể nghe lại và nhập transcript thủ công.</p><audio controls src="${recordBlobUrl}" style="max-width:100%"></audio>`);};recorder.start();updateMicStatus('🔴 Đang ghi âm — bấm microphone lần nữa để dừng. Trình duyệt này chưa hỗ trợ nhận dạng tiếng nói.');}
catch(e){updateMicStatus('Không truy cập được microphone. Kiểm tra quyền và HTTPS/localhost.');}}
function saveSettings(){db.name=($('#profileName')?.value||'Learner').trim().slice(0,35)||'Learner';db.level=$('#profileLevel')?.value||'B1';db.goal=$('#profileGoal')?.value||'Giao tiếp tự tin';db.minutes=Number($('#profileMinutes')?.value)||20;db.settings.autoSpeak=Boolean($('#autoSpeak')?.checked);speak.level=db.level;persist();render();toast('Đã lưu hồ sơ học tập.');}
function exportData(){const b=new Blob([JSON.stringify({version:1,exported:new Date().toISOString(),data:db},null,2)],{type:'application/json'});const url=URL.createObjectURL(b);const link=document.createElement('a');link.href=url;link.download=`speakflow-backup-${dateKey()}.json`;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1200);toast('Đã xuất dữ liệu JSON.');}
async function importData(file){if(!file)return;try{const obj=JSON.parse(await file.text());const incoming=obj.data;if(!incoming||!Array.isArray(incoming.favorites)||!Array.isArray(incoming.sessions)||typeof incoming.reviews!=='object')throw Error('Dữ liệu không đúng cấu trúc');db={...structuredClone(DEFAULT),...incoming};db.favorites=db.favorites.filter(x=>Number.isInteger(x)&&x>0&&x<=WORDS.length).slice(0,WORDS.length);db.sessions=db.sessions.slice(0,200);db.examAttempts=(db.examAttempts||[]).slice(0,200);db.quizAttempts=(Array.isArray(db.quizAttempts)?db.quizAttempts:[]).slice(0,100);persist();render();toast('Đã nhập bản sao lưu.');}catch(e){toast('Tệp sao lưu không hợp lệ.');}}
const ROUTES={dashboard:'Tổng quan',speaking:'AI Speaking',vocabulary:'Từ vựng',flashcards:'Flashcards',quiz:'Quiz từ vựng',ielts:'IELTS Speaking',toeic:'TOEIC Speaking',pronunciation:'Phát âm',progress:'Tiến độ',settings:'Cài đặt'};
function go(dest){if(!ROUTES[dest])dest='dashboard';stopTimer();if(recognizer||recorder?.state==='recording')stopMic();if(dest==='ielts'&&route!=='ielts'){exam={kind:'ielts',part:'Part 1',index:0,answer:'',feedback:'',started:false};}if(dest==='toeic'&&route!=='toeic'){exam={kind:'toeic',part:'Part 1',index:0,answer:'',feedback:'',started:false};}route=dest;$('#sidebar').classList.remove('open');render();window.scrollTo({top:0,behavior:'instant'});try{history.replaceState(null,'','#'+dest);}catch{}}
function render(){const fn={dashboard,vocabulary,flashcards,quiz:quizPage,speaking:speechPanel,ielts:()=>examPanel('ielts'),toeic:()=>examPanel('toeic'),pronunciation,progress,settings:settingsPage};view.innerHTML=fn[route]();$('#breadcrumb').innerHTML=`Học tập <span>/</span> ${ROUTES[route]}`;document.querySelectorAll('[data-route]').forEach(el=>el.classList.toggle('selected',el.dataset.route===route));if(route==='speaking'&&speak.active){const log=$('#chatLog');if(log)log.scrollTop=log.scrollHeight;}}
// Event delegation: các trang được cập nhật mà không làm mất các nút hoạt động.
document.addEventListener('click',async e=>{const b=e.target.closest('button,[data-flip],label');if(!b)return;if(b.closest('.modal-shade')&&e.target.classList.contains('modal-shade'))return;
if(b.dataset.go){go(b.dataset.go);return;}
if(b.dataset.route){go(b.dataset.route);return;}
if(b.id==='menuToggle'){$('#sidebar').classList.toggle('open');return;}
if(b.id==='avatarBtn'){go('settings');return;}
if(b.hasAttribute('data-close-modal')){closeModal();return;}
if(b.dataset.say){readAloud(b.dataset.say);return;}
if(b.dataset.favorite){const id=Number(b.dataset.favorite);if(db.favorites.includes(id))db.favorites=db.favorites.filter(x=>x!==id);else db.favorites.push(id);persist();if($('#modalRoot').children.length)wordDialog(id);render();return;}
if(b.dataset.word){wordDialog(Number(b.dataset.word));return;}
if(b.hasAttribute('data-only-saved')){filter.onlySaved=!filter.onlySaved;render();return;}
if(b.dataset.flashMode){flash.mode=b.dataset.flashMode;nextFlash(true);render();return;}
if(b.hasAttribute('data-flip')){flash.flipped=!flash.flipped;render();return;}
if(b.dataset.review){reviewWord(b.dataset.review);return;}
if(b.hasAttribute('data-quiz-restart')){buildQuiz();render();return;}
if(b.dataset.quizChoice){quizChoose(Number(b.dataset.quizChoice));return;}
if(b.hasAttribute('data-quiz-next')){quizNext();return;}
if(b.hasAttribute('data-start-practice')){startPractice();return;}
if(b.hasAttribute('data-send-answer')){await submitSpeak();return;}
if(b.hasAttribute('data-end-practice')){endPractice();return;}
if(b.dataset.record){await startRecording(b.dataset.record);return;}
if(b.dataset.examPart){exam.part=b.dataset.examPart;exam.index=0;exam.answer='';exam.feedback='';stopTimer();render();return;}
if(b.dataset.examIndex!==undefined){exam.index=Number(b.dataset.examIndex);exam.answer='';exam.feedback='';stopTimer();render();return;}
if(b.dataset.timer){if(b.dataset.timer==='stop'){stopTimer();toast('Đã dừng đồng hồ.');}else startTimer(b.dataset.timer);return;}
if(b.hasAttribute('data-check-exam')){saveExam();return;}
if(b.hasAttribute('data-ai-evaluate')){await evaluateExamWithAI();return;}
if(b.hasAttribute('data-show-sample')){sampleDialog();return;}
if(b.hasAttribute('data-next-exam')){exam.index=(exam.index+1)%examQuestions().length;exam.answer='';exam.feedback='';stopTimer();render();return;}
if(b.dataset.pronIndex!==undefined){pron.index=Number(b.dataset.pronIndex);render();return;}
if(b.dataset.session!==undefined){sessionModal(Number(b.dataset.session));return;}
if(b.dataset.attempt!==undefined){attemptModal(Number(b.dataset.attempt));return;}
if(b.hasAttribute('data-save-settings')){saveSettings();return;}
if(b.hasAttribute('data-export')){exportData();return;}
if(b.hasAttribute('data-reset')){if(confirm('Xóa toàn bộ tiến độ trên trình duyệt này? Bạn không thể khôi phục nếu chưa xuất bản sao lưu.')){db=structuredClone(DEFAULT);persist();speak.level=db.level;nextFlash(true);buildQuiz();render();toast('Đã xóa dữ liệu học tập.');}return;}
});
document.addEventListener('change',async e=>{if(e.target.id==='quizLevel'){quiz.level=e.target.value;buildQuiz();render();}else if(e.target.id==='vocabLevel'){filter.level=e.target.value;render();}else if(e.target.id==='vocabTopic'){filter.topic=e.target.value;render();}else if(e.target.id==='speakTopic'){speak.topic=e.target.value;render();}else if(e.target.id==='speakLevel'){speak.level=e.target.value;render();}else if(e.target.id==='speakMode'){speak.mode=e.target.value;render();}else if(e.target.id==='importFile'){await importData(e.target.files?.[0]);}});
document.addEventListener('input',e=>{if(e.target.id==='vocabSearch'){filter.search=e.target.value;const filtered=WORDS.filter(w=>(filter.level==='All'||w.level===filter.level)&&(filter.topic==='All'||w.topic===filter.topic)&&(!filter.onlySaved||db.favorites.includes(w.id))&&[w.word,w.vi,w.example,w.topic].join(' ').toLowerCase().includes(filter.search.toLowerCase()));const grid=$('#wordGrid');if(grid)grid.innerHTML=filtered.map(wordCard).join('')||'<div class="card empty">Không tìm thấy từ phù hợp.</div>';const c=$('.word-count');if(c)c.innerHTML=`Đang hiển thị <strong>${filtered.length}</strong> / ${WORDS.length} từ · <strong>${db.favorites.length}</strong> từ đã lưu`;}else if(e.target.id==='examAnswer')exam.answer=e.target.value;});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Enter'&&e.target.id==='speakAnswer'){e.preventDefault();submitSpeak();}if((e.key==='Enter'||e.key===' ')&&e.target.hasAttribute('data-flip')){e.preventDefault();flash.flipped=!flash.flipped;render();}});
$('#modalRoot').addEventListener('click',e=>{if(e.target.classList.contains('modal-shade'))closeModal();});
(async function init(){try{if(location.protocol.startsWith('http')){const r=await fetch('/api/config',{signal:AbortSignal.timeout(1800)});if(r.ok){const config=await r.json();apiConnected=Boolean(config.aiConnected);}}}catch{}const wanted=location.hash.replace('#','');route=ROUTES[wanted]?wanted:'dashboard';render();})();

</script>
</body>
